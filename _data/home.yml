# Publications are shown as a horizontal card slider.
# authors: HTML allowed; wrap your own name in <span class="me">...</span>.
# idea: optional one-line summary shown when hovering/tapping the lightbulb.
# Add links as e.g. - { name: Paper, icon: fas fa-file-pdf, url: "https://..." } and an image under assets/img/.
# figures: thumbnail(s) at the top of the card (click to enlarge); figure_source is appended to each caption.
publications:
  - title: "Beam Search as Test-Time Self-Distillation via Counterfactual Contexts"
    venue: NeurIPS 2026 Workshop
    authors: '<span class="me">Sara S. E. Tan</span>, Xiaotong Ji, Rasul Tutunov, Haitham Bou-Ammar, Matthieu Zimmer'
    idea: A decoding method that steers the model towards better answers using contrastive prompts, with no retraining or reward models.
    links:
      - { name: arXiv, icon: fas fa-file-pdf, url: "https://arxiv.org/abs/2609.37041" }
    figure_source: Tan et al., arXiv:2609.37041 (2026)
    figures:
      - src: publications/neurips26-fig1.jpg
        caption: "Figure 1: Inference efficiency of (a) Qwen2.5-7B and (b) DeepSeek-Math-7B-Instruct on MATH500."
      - src: publications/neurips26-fig4.jpg
        caption: "Figure 4: Pass@k on MATH500 for power sampling (PS), standard beam search (BS) and contrastive beam search (CBS), DeepSeek-Math-7B-Instruct."
      - src: publications/neurips26-fig5.jpg
        caption: "Figure 5: Best-of-16 accuracy for ten contrastive context pairs on MATH500, HumanEval and GPQA (Qwen2.5-7B)."
    bibtex: |
      @inproceedings{tan2026beam,
        title={Beam Search as Test-Time Self-Distillation via Counterfactual Contexts},
        author={Tan, Su Ee and Ji, Xiaotong and Tutunov, Rasul and Bou-Ammar, Haitham and Zimmer, Matthieu},
        booktitle={NeurIPS Workshop on Towards Test-Time Continual Learning Agents},
        year={2026},
        eprint={2609.37041},
        archivePrefix={arXiv}
      }
  - title: "Tissue shear as a cue for aligning planar polarity in the developing Drosophila wing"
    venue: Nature Communications 2025
    authors: '<span class="me">Sara S. E. Tan</span>, David Strutt'
    idea: Investigates how mechanical forces (tissue shear) orient planar cell polarity during organ development.
    links:
      - { name: Paper, icon: fas fa-file-pdf, url: "https://doi.org/10.1038/s41467-025-56744-7" }
    figure_source: Tan & Strutt, Nature Communications (2025), open access
    figures:
      - src: publications/natcomms25-model.jpg
        caption: "Fig. 8f: Model of how tissue stress anisotropy drives a gradient of cell flow, destabilising core proteins and aligning proximal-distal polarity."
    bibtex: |
      @article{tan2025tissue,
        title={Tissue shear as a cue for aligning planar polarity in the developing Drosophila wing},
        author={Tan, Su Ee and Strutt, David},
        journal={Nature Communications},
        year={2025},
        doi={10.1038/s41467-025-56744-7}
      }
  - title: "Distinct mechanisms of planar polarization by the core and Fat-Dachsous planar polarity pathways in the Drosophila wing"
    venue: Cell Reports 2022
    authors: 'Alexander Brittle, Samantha J. Warrington, Helen Strutt, Elizabeth Manning, <span class="me">Sara S. E. Tan</span>, David Strutt'
    links:
      - { name: Paper, icon: fas fa-file-pdf, url: "https://doi.org/10.1016/j.celrep.2022.111419" }
    figure_source: Brittle et al., Cell Reports (2022), open access
    figures:
      - src: publications/cellrep22-fig1.jpg
        caption: "Figure 1: Organization of the core and Ft-Ds planar polarity pathways in the pupal wing."
    bibtex: |
      @article{brittle2022distinct,
        title={Distinct mechanisms of planar polarization by the core and Fat-Dachsous planar polarity pathways in the Drosophila wing},
        author={Brittle, Alexander and Warrington, Samantha J. and Strutt, Helen and Manning, Elizabeth and Tan, Su Ee and Strutt, David},
        journal={Cell Reports},
        year={2022},
        doi={10.1016/j.celrep.2022.111419}
      }
  - title: "QuantifyPolarity, a new tool-kit for measuring planar polarized protein distributions and cell properties in developing tissues"
    venue: Development 2021
    authors: '<span class="me">Sara S. E. Tan</span>, Weijie Tan, Katherine H. Fisher, David Strutt'
    idea: Open-source image analysis software for quantifying planar polarity and cell properties, adopted by research institutions worldwide.
    links:
      - { name: Paper, icon: fas fa-file-pdf, url: "https://doi.org/10.1242/dev.198952" }
    figure_source: Tan et al., Development (2021), open access
    figures:
      - src: publications/dev21-fig5.jpg
        caption: "Fig. 5: QuantifyPolarity graphical user interface for quantification of planar cell polarity and cell shape."
    bibtex: |
      @article{tan2021quantifypolarity,
        title={QuantifyPolarity, a new tool-kit for measuring planar polarized protein distributions and cell properties in developing tissues},
        author={Tan, Su Ee and Tan, Weijie and Fisher, Katherine H. and Strutt, David},
        journal={Development},
        year={2021},
        doi={10.1242/dev.198952}
      }

# Selected projects grid. image is relative to assets/img/ (falls back to icon).
projects:
  - title: Research-Bot
    year: 2025
    image: projects/research-bot.jpg
    desc: Agentic AI tool for automated literature reviews. It analyzes your query, retrieves the most relevant papers from online and offline sources, and produces structured summaries with direct citations.
    links:
      - { name: Website, icon: fas fa-globe, url: "https://hai-mate.github.io/research-concise/research-bot1/" }
      - { name: Try it, icon: fas fa-rocket, url: "https://research-concise-app.streamlit.app/" }
  - title: QuantifyPolarity, a Biological Image Analysis Software
    year: 2021
    image: projects/quantifypolarity.jpg
    desc: Automatically quantifies protein distribution and cellular properties in developing tissues. Widely adopted by research institutions around the world and cited in numerous peer-reviewed publications.
    links:
      - { name: Paper, icon: fas fa-file-pdf, url: "https://doi.org/10.1242/dev.198952" }
  - title: Automated Cell Segmentation and Tracking Toolkit with Machine Learning
    year: 2018
    image: projects/cell-tracking.jpg
    desc: Automated real-time cell segmentation and tracking graphical user interface (GUI) for quantitative analysis.
  - title: FibrosisQuant, Automated Quantification of Cystic Fibrosis
    year: 2016
    image: projects/fibrosisquant.jpg
    desc: A robust yet user-friendly GUI for automated quantification of cystic fibrosis in human lung cell specimens.
  - title: Automated Protein Tracking and Quantification GUI
    year: 2015
    image: projects/protein-tracking.jpg
    desc: An automated GUI for tracking and quantification of the morphology and dynamics of protein over time.
  - title: MRI Brain Tumor Detection Graphical User Interface
    year: 2013
    image: projects/mri-brain-tumor.jpg
    desc: Medical imaging computer-aided diagnostic GUI for visualization and automated detection of brain tumor in MRI scans.

